<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mathis Sananes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Mathis Sananes. Showreel et sélection de travaux.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #6e6e73;
      --max: 1080px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Header — glass style Apple */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      transition: background .3s ease;
    }
    .nav {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.25rem;
    }
    .brand { display: inline-block; line-height: 1; }
    .brand-name {
      font-weight: 600;
      letter-spacing: -0.015em;
      font-size: 1.05rem;
    }
    .subtitle {
      margin-top: 3px;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.75rem;
      font-size: .85rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      opacity: .8;
      transition: opacity .2s ease;
    }
    nav a:hover { opacity: 1; }

    /* Fullscreen showreel — no controls, embedded in the page */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    /* subtle vignette so text/nav breathes on light frames */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: .7rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .85;
      animation: floaty 2.4s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes floaty {
      0%,100% { transform: translate(-50%, 0); opacity: .85; }
      50% { transform: translate(-50%, 8px); opacity: .5; }
    }

    footer {
      padding: 2.5rem 1rem 3rem;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: -0.01em;
      border-top: 1px solid rgba(0,0,0,0.08);
      background: #fbfbfd;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-name">Mathis Sananes</div>
        <div class="subtitle">réalisateur · scénariste · monteur</div>
      </div>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="videos.html">Vidéos</a>
        <a href="autres.html">Autres</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <video autoplay muted loop playsinline preload="auto" disablepictureinpicture>
      <source src="showreel.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
    <div class="scroll-hint">Scroll</div>
  </section>

  <footer>
    © 2025 Mathis Sananes. Tous droits réservés.
  </footer>
</body>
</html>
