<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Autres – Mathis Sananes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Autres projets de Mathis Sananes : théâtre, photographies et making-of.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --text: #f2efe9;
      --muted: #8a867e;
      --line: rgba(242,239,233,0.08);
      --accent: #d9b478;
      --max: 1280px;
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(217,180,120,0.06), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(217,180,120,0.04), transparent 60%);
    }
    header {
      position: sticky; top: 0;
      background: rgba(11,11,12,0.72);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      z-index: 50; border-bottom: 1px solid var(--line);
    }
    .nav {
      max-width: var(--max); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.25rem;
    }
    .brand { display: inline-block; line-height: 1; }
    .brand-name { font-family: "Instrument Serif", serif; font-weight: 400; letter-spacing: .01em; font-size: 1.35rem; }
    .subtitle {
      margin-top: 4px; font-size: 0.58rem; color: var(--muted);
      letter-spacing: 0.22em; text-transform: uppercase; line-height: 1; white-space: nowrap;
    }
    nav a {
      position: relative; color: var(--muted); text-decoration: none;
      margin-left: 1.6rem; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase;
      transition: color .3s var(--ease);
    }
    nav a::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
      height: 1px; background: var(--accent);
      transform: scaleX(0); transform-origin: right;
      transition: transform .5s var(--ease);
    }
    nav a:hover { color: var(--text); }
    nav a:hover::after { transform: scaleX(1); transform-origin: left; }

    main {
      position: relative; z-index: 1;
      max-width: var(--max); margin: 0 auto;
      padding: 4rem 1.25rem 4rem;
    }

    .page-eyebrow {
      display: flex; align-items: center; gap: .8rem;
      color: var(--muted); font-size: .72rem;
      letter-spacing: .28em; text-transform: uppercase; margin-bottom: 1rem;
    }
    .page-eyebrow::before { content: ""; width: 32px; height: 1px; background: var(--accent); display: inline-block; }
    .page-title {
      font-family: "Instrument Serif", serif; font-weight: 400;
      font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1; letter-spacing: -.01em;
      margin: 0 0 3.5rem;
    }
    .page-title em { font-style: italic; color: var(--accent); }

    .project {
      display: flex; flex-wrap: wrap; gap: 3rem;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4.5rem; margin-bottom: 4.5rem;
    }

    .project-poster {
      flex: 0 0 435px; max-width: 435px;
      border: 1px solid var(--line);
      border-radius: .6rem;
      background: #131315;
      object-fit: cover;
      align-self: flex-start;
      aspect-ratio: 2/3;
      width: 100%;
      box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7);
      transition: transform .8s var(--ease), box-shadow .8s var(--ease), filter .8s var(--ease);
      filter: saturate(.95);
    }
    .project-poster:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 40px 80px -25px rgba(0,0,0,0.9), 0 0 0 1px rgba(217,180,120,0.2);
      filter: saturate(1.1);
    }

    .project-content { flex: 1 1 600px; display: flex; flex-direction: column; }

    .project-title {
      font-family: "Instrument Serif", serif;
      font-size: 2.2rem; font-weight: 400;
      margin: 0 0 .3rem; letter-spacing: -.01em;
    }
    .project-title span.year {
      font-weight: 400; color: var(--muted); font-size: 1.1rem;
      font-family: "Inter", sans-serif; margin-left: .4rem;
    }

    .project-type {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .22em;
      color: var(--muted); margin-bottom: 2rem;
    }

    .screenshots-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2rem;
    }
    .screenshots-grid img,
    .photos-grid img,
    .makingof-grid img {
      width: 100%; aspect-ratio: 16/9; object-fit: cover;
      border-radius: .4rem; border: 1px solid var(--line);
      background: #131315; cursor: pointer;
      transition: transform .6s var(--ease), filter .6s var(--ease), box-shadow .6s var(--ease);
      filter: brightness(.92) saturate(.9);
    }
    .screenshots-grid img:hover,
    .photos-grid img:hover,
    .makingof-grid img:hover {
      transform: scale(1.03);
      filter: brightness(1.05) saturate(1.05);
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7);
      z-index: 2; position: relative;
    }

    .section-title {
      font-family: "Instrument Serif", serif;
      font-size: 2rem; font-weight: 400;
      margin: 4rem 0 2rem; letter-spacing: -.01em;
    }

    .photos-grid, .makingof-grid { display: grid; gap: 1rem; }
    .photos-grid { grid-template-columns: repeat(4, 1fr); }
    .makingof-grid { grid-template-columns: repeat(4, 1fr); }

    /* Overlay */
    .image-overlay {
      position: fixed; inset: 0;
      background: rgba(6,6,7,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center;
      z-index: 999; padding: 1.5rem;
      opacity: 0; transition: opacity .35s var(--ease);
    }
    .image-overlay.active { display: flex; opacity: 1; }
    .image-overlay img {
      max-width: min(92vw, 1200px); max-height: 90vh;
      border-radius: .5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      background: #000;
      transform: scale(.97);
      transition: transform .5s var(--ease);
    }
    .image-overlay.active img { transform: scale(1); }
    .overlay-close {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: rgba(255,255,255,0.08);
      color: #fff; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 9999px; width: 40px; height: 40px;
      cursor: pointer; font-size: 1.3rem; line-height: 1;
      transition: background .3s var(--ease), transform .3s var(--ease);
    }
    .overlay-close:hover { background: rgba(255,255,255,0.15); transform: rotate(90deg); }

    footer {
      position: relative; z-index: 1;
      margin-top: 4rem; padding: 2rem 1rem 3rem;
      text-align: center; color: var(--muted);
      font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      border-top: 1px solid var(--line);
    }

    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .stagger > * { opacity: 0; transform: translateY(20px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
    .stagger.in > * { opacity: 1; transform: none; }
    .stagger.in > *:nth-child(1){transition-delay:.05s} .stagger.in > *:nth-child(2){transition-delay:.1s}
    .stagger.in > *:nth-child(3){transition-delay:.15s} .stagger.in > *:nth-child(4){transition-delay:.2s}
    .stagger.in > *:nth-child(5){transition-delay:.25s} .stagger.in > *:nth-child(6){transition-delay:.3s}
    .stagger.in > *:nth-child(7){transition-delay:.35s} .stagger.in > *:nth-child(8){transition-delay:.4s}

    @media (max-width: 1100px) {
      .project { flex-direction: column; align-items: stretch; }
      .project-poster { max-width: 100%; width: 100%; aspect-ratio: 3/4; }
      .photos-grid, .makingof-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      nav a { margin-left: .9rem; font-size: .72rem; }
      .photos-grid, .makingof-grid, .screenshots-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-name">Mathis Sananes</div>
        <div class="subtitle">réalisateur · scénariste · monteur</div>
      </div>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="videos.html">Vidéos</a>
        <a href="autres.html">Autres</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-eyebrow reveal">Théâtre · Photographies · Making of</div>
    <h1 class="page-title reveal">A<em>u</em>tres</h1>

    <!-- Le Roi se meurt -->
    <article class="project reveal">
      <img src="le-roi-se-meurt-affiche.jpg" alt="" class="project-poster">
      <div class="project-content">
        <h2 class="project-title">Le Roi se meurt <span class="year">(2023)</span></h2>
        <div class="project-type">pièce de théâtre</div>
        <div class="screenshots-grid stagger">
          <img src="le-roi-se-meurt-shot-1.jpg" alt="">
          <img src="le-roi-se-meurt-shot-2.jpg" alt="">
          <img src="le-roi-se-meurt-shot-3.jpg" alt="">
          <img src="le-roi-se-meurt-shot-4.jpg" alt="">
        </div>
      </div>
    </article>

    <!-- Photographies -->
    <section class="photos-section reveal">
      <h2 class="section-title">Photographies</h2>
      <div class="photos-grid stagger">
        <img src="photo-1.jpg" alt="">
        <img src="photo-2.jpg" alt="">
        <img src="photo-3.jpg" alt="">
        <img src="photo-4.jpg" alt="">
      </div>
    </section>

    <!-- Making Of -->
    <section class="makingof-section reveal">
      <h2 class="section-title">Making Of</h2>
      <div class="makingof-grid stagger">
        <img src="makingof-1.jpg" alt="">
        <img src="makingof-2.jpg" alt="">
        <img src="makingof-3.jpg" alt="">
        <img src="makingof-4.jpg" alt="">
        <img src="makingof-5.jpg" alt="">
        <img src="makingof-6.jpg" alt="">
        <img src="makingof-7.jpg" alt="">
        <img src="makingof-8.jpg" alt="">
      </div>
    </section>
  </main>

  <div class="image-overlay" id="imageOverlay">
    <button class="overlay-close" id="overlayClose">×</button>
    <img id="overlayImg" src="" alt="">
  </div>

  <footer>© 2025 Mathis Sananes — Tous droits réservés</footer>

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal, .stagger').forEach(el => io.observe(el));

    const zoomables = document.querySelectorAll('.screenshots-grid img, .photos-grid img, .makingof-grid img');
    const overlay = document.getElementById('imageOverlay');
    const overlayImg = document.getElementById('overlayImg');
    const closeBtn = document.getElementById('overlayClose');

    zoomables.forEach(img => {
      img.addEventListener('click', () => {
        overlayImg.src = img.src;
        overlay.classList.add('active');
      });
    });
    overlay.addEventListener('click', e => {
      if (e.target === overlay || e.target === closeBtn) {
        overlay.classList.remove('active');
        setTimeout(() => { overlayImg.src = ''; }, 300);
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        overlay.classList.remove('active');
        setTimeout(() => { overlayImg.src = ''; }, 300);
      }
    });
  </script>
</body>
</html>
