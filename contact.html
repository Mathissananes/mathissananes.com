<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact – Mathis Sananes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact de Mathis Sananes : e-mail et Instagram.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --text: #f2efe9;
      --muted: #8a867e;
      --line: rgba(242,239,233,0.08);
      --accent: #d9b478;
      --max: 900px;
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(217,180,120,0.08), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(217,180,120,0.05), transparent 60%);
    }
    header {
      position: sticky; top: 0;
      background: rgba(11,11,12,0.72);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      z-index: 50; border-bottom: 1px solid var(--line);
    }
    .nav {
      max-width: 1180px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.25rem;
    }
    .brand { display: inline-block; line-height: 1; }
    .brand-name { font-family: "Instrument Serif", serif; font-weight: 400; letter-spacing: .01em; font-size: 1.35rem; }
    .subtitle {
      margin-top: 4px; font-size: 0.58rem; color: var(--muted);
      letter-spacing: 0.22em; text-transform: uppercase; line-height: 1; white-space: nowrap;
    }
    nav a {
      position: relative; color: var(--muted); text-decoration: none;
      margin-left: 1.6rem; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase;
      transition: color .3s var(--ease);
    }
    nav a::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
      height: 1px; background: var(--accent);
      transform: scaleX(0); transform-origin: right;
      transition: transform .5s var(--ease);
    }
    nav a:hover { color: var(--text); }
    nav a:hover::after { transform: scaleX(1); transform-origin: left; }

    main {
      position: relative; z-index: 1;
      max-width: var(--max); margin: 0 auto;
      padding: 5rem 1.25rem 4rem;
      text-align: center;
    }

    .contact-eyebrow {
      display: inline-flex; align-items: center; gap: .8rem;
      color: var(--muted); font-size: .72rem;
      letter-spacing: .28em; text-transform: uppercase; margin-bottom: 1rem;
    }
    .contact-eyebrow::before, .contact-eyebrow::after {
      content: ""; width: 32px; height: 1px; background: var(--accent); display: inline-block;
    }
    .contact-title {
      font-family: "Instrument Serif", serif; font-weight: 400;
      font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1;
      margin: 0 0 1rem; letter-spacing: -.01em;
    }
    .contact-title em { font-style: italic; color: var(--accent); }
    .contact-subtitle {
      font-size: 1rem; color: var(--muted);
      margin: 0 auto 3.5rem; max-width: 520px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.4rem;
      text-align: left;
    }

    .contact-card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 2rem 1.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      overflow: hidden;
      transition: transform .5s var(--ease), border-color .5s var(--ease), background .5s var(--ease);
    }
    .contact-card::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(400px 200px at var(--mx,50%) var(--my,0%), rgba(217,180,120,0.1), transparent 60%);
      opacity: 0;
      transition: opacity .5s var(--ease);
      pointer-events: none;
    }
    .contact-card:hover {
      transform: translateY(-4px);
      border-color: rgba(217,180,120,0.3);
    }
    .contact-card:hover::before { opacity: 1; }

    .contact-label {
      font-size: .7rem; text-transform: uppercase;
      letter-spacing: .22em; color: var(--muted);
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: .6rem;
    }
    .contact-icon { width: 18px; height: 18px; opacity: .8; color: var(--accent); }
    .contact-name {
      font-family: "Instrument Serif", serif;
      font-size: 1.5rem; font-weight: 400;
      margin-bottom: 1.5rem; word-break: break-all;
    }
    .contact-actions { margin-top: 0; }

    .btn-link {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .6rem 1.1rem;
      border-radius: 9999px;
      border: 1px solid rgba(217,180,120,0.4);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      text-decoration: none;
      color: var(--accent);
      background: transparent;
      transition: all .35s var(--ease);
    }
    .btn-link::after {
      content: "→"; transition: transform .35s var(--ease);
    }
    .btn-link:hover {
      background: var(--accent); color: #0b0b0c;
      border-color: var(--accent);
    }
    .btn-link:hover::after { transform: translateX(4px); }

    footer {
      position: relative; z-index: 1;
      margin-top: 4rem; padding: 2rem 1rem 3rem;
      text-align: center; color: var(--muted);
      font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      border-top: 1px solid var(--line);
    }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .reveal.d1 { transition-delay: .1s; }
    .reveal.d2 { transition-delay: .2s; }
    .reveal.d3 { transition-delay: .3s; }
    .reveal.d4 { transition-delay: .4s; }

    @media (max-width: 720px) {
      .contact-grid { grid-template-columns: 1fr; }
      nav a { margin-left: .9rem; font-size: .72rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-name">Mathis Sananes</div>
        <div class="subtitle">réalisateur · scénariste · monteur</div>
      </div>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="videos.html">Vidéos</a>
        <a href="autres.html">Autres</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="contact-eyebrow reveal">Prendre contact</div>
    <h1 class="contact-title reveal d1">Parl<em>o</em>ns.</h1>
    <p class="contact-subtitle reveal d2">Pour toute prise de contact, les infos sont juste ici.</p>

    <div class="contact-grid">
      <!-- Instagram -->
      <section class="contact-card reveal d3">
        <div class="contact-label">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1.2"></circle>
          </svg>
          Instagram
        </div>
        <div class="contact-name">@mathissananes</div>
        <div class="contact-actions">
          <a class="btn-link" href="https://www.instagram.com/mathissananes/" target="_blank" rel="noopener noreferrer">
            Ouvrir Instagram
          </a>
        </div>
      </section>

      <!-- Email -->
      <section class="contact-card reveal d4">
        <div class="contact-label">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16v16H4z"></path>
            <path d="m4 4 8 8 8-8"></path>
          </svg>
          E-mail
        </div>
        <div class="contact-name">mathis.s@live.fr</div>
        <div class="contact-actions">
          <a class="btn-link" href="mailto:mathis.s@live.fr">Écrire un mail</a>
        </div>
      </section>
    </div>
  </main>

  <footer>© 2025 Mathis Sananes — Tous droits réservés</footer>

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    document.querySelectorAll('.contact-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
      });
    });
  </script>
</body>
</html>
