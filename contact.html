<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact – Mathis Sananes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact de Mathis Sananes : e-mail et Instagram.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #6e6e73;
      --max: 720px;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .nav {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.25rem;
    }
    .brand { display: inline-block; line-height: 1; }
    .brand-name { font-weight: 600; letter-spacing: -0.015em; font-size: 1.05rem; }
    .subtitle {
      margin-top: 3px; font-size: 0.55rem; color: var(--muted);
      letter-spacing: 0.04em; line-height: 1; white-space: nowrap;
    }
    nav a {
      color: var(--text); text-decoration: none; margin-left: 1.75rem;
      font-size: .85rem; opacity: .8; transition: opacity .2s ease;
      letter-spacing: -0.01em;
    }
    nav a:hover { opacity: 1; }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 8rem 1.25rem 5rem;
      text-align: center;
    }

    .contact-title {
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: -0.035em;
      margin: 0 0 .8rem;
      line-height: 1.02;
    }
    .contact-subtitle {
      font-size: 1.1rem;
      color: var(--muted);
      letter-spacing: -0.01em;
      margin-bottom: 3.5rem;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
    }

    .contact-card {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 2rem 1.8rem;
      text-align: left;
      background: #fbfbfd;
      transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s ease, background .3s ease;
    }
    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 60px -20px rgba(0,0,0,0.2);
      background: #ffffff;
    }

    .contact-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--muted);
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .contact-icon {
      width: 18px; height: 18px; opacity: .75;
    }
    .contact-name {
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: .2rem;
      word-break: break-all;
    }
    .contact-actions { margin-top: 1.3rem; }

    .btn-link {
      display: inline-block;
      padding: .55rem 1.2rem;
      border-radius: 9999px;
      background: #000;
      border: 1px solid #000;
      font-size: .8rem;
      letter-spacing: -0.005em;
      text-decoration: none;
      color: #fff;
      transition: transform .25s ease, background .25s ease;
    }
    .btn-link:hover { transform: scale(1.04); background: #1d1d1f; }

    /* Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1);
    }
    .reveal.in { opacity: 1; transform: none; }
    .reveal-stagger > * {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
    }
    .reveal-stagger.in > * { opacity: 1; transform: none; }
    .reveal-stagger.in > *:nth-child(1) { transition-delay: 100ms; }
    .reveal-stagger.in > *:nth-child(2) { transition-delay: 200ms; }

    footer {
      padding: 2.5rem 1rem 3rem;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      border-top: 1px solid rgba(0,0,0,0.08);
      background: #fbfbfd;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-name">Mathis Sananes</div>
        <div class="subtitle">réalisateur · scénariste · monteur</div>
      </div>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="videos.html">Vidéos</a>
        <a href="autres.html">Autres</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="contact-title reveal">Contact</h1>
    <p class="contact-subtitle reveal">
      Pour toute prise de contact, les infos sont juste ici.
    </p>

    <div class="contact-grid reveal-stagger">

      <section class="contact-card">
        <div class="contact-label">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1.2"></circle>
          </svg>
          Instagram
        </div>
        <div class="contact-name">@mathissananes</div>
        <div class="contact-actions">
          <a class="btn-link" href="https://www.instagram.com/mathissananes/" target="_blank" rel="noopener noreferrer">
            Ouvrir Instagram
          </a>
        </div>
      </section>

      <section class="contact-card">
        <div class="contact-label">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16v16H4z"></path>
            <path d="m4 4 8 8 8-8"></path>
          </svg>
          E-mail
        </div>
        <div class="contact-name">mathis.s@live.fr</div>
        <div class="contact-actions">
          <a class="btn-link" href="mailto:mathis.s@live.fr">Écrire un mail</a>
        </div>
      </section>

    </div>
  </main>

  <footer>
    © 2025 Mathis Sananes. Tous droits réservés.
  </footer>

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => io.observe(el));
  </script>
</body>
</html>
